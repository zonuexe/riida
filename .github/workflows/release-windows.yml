name: release-windows

on:
  # On pull requests this workflow only runs the Windows Rust verification
  # (the bundle build is gated to tags / manual dispatch below). That check is
  # only meaningful when the Rust build inputs change, so skip it for
  # frontend-only PRs. Tag pushes and workflow_dispatch are unaffected by this
  # filter and always build the bundle.
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/fetch-pdfium.mjs"
      - ".github/workflows/release-windows.yml"
  # Run the same verification on master so master owns a warm Windows Rust
  # cache. GitHub scopes caches by ref: a PR can read caches saved on its base
  # branch but never those of another PR, so without this run every PR starts
  # from a cold `target/` and rebuilds the whole dependency tree (~10 min).
  # `paths` is not evaluated for tag pushes, so tags still always build.
  push:
    tags:
      - "v*"
    branches:
      - master
    paths:
      - "src-tauri/**"
      - "scripts/fetch-pdfium.mjs"
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

jobs:
  build-windows:
    name: build-windows-x86_64
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Only master's cache is ever reused (see the push trigger above), so
          # skip the ~1 GB upload on PRs and tags: it cost over a minute per run
          # and churned the repository's 10 GB cache budget without benefit.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit,cargo-machete

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch libpdfium
        run: node scripts/fetch-pdfium.mjs

      - name: Run Rust verification checks
        # Match test-rust.yml: incremental artifacts are useless on CI and
        # debuginfo roughly doubles the size of `target/` that the cache has to
        # move. Scoped to this step so the tagged release build is untouched.
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C debuginfo=0"
        run: npm run check:rust

      - name: Build Windows release bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "riida ${{ github.ref_name }}"
          releaseBody: "Automated Windows build for riida."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Build Windows workflow artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: tauri-apps/tauri-action@v0.6.2
        with:
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "riida-[target-triple]-[bundle]"
          args: --target x86_64-pc-windows-msvc
